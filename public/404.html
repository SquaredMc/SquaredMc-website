<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>Page not found — SquaredMc</title>
    <script>
      // GitHub Pages serves this one page for every missing path on the site,
      // so a miss inside an app's folder is handed to that app's own 404 page.
      // (Cloudflare Pages serves the nearest 404.html itself, so there the
      // app pages are found directly.)
      var apps = ["refuelr"]
      var app = location.pathname.split("/")[1]
      if (apps.indexOf(app) !== -1) location.replace("/" + app + "/404.html")
    </script>
    <!-- Absolute paths only: this page is served at whatever depth was requested. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #000;
        color: #fff;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 48px 28px;
        max-width: 720px;
      }
      .eyebrow {
        margin: 0 0 16px;
        color: rgba(255, 255, 255, 0.35);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(32px, 6vw, 56px);
        font-weight: 600;
        line-height: 1.05;
        text-wrap: balance;
      }
      p {
        margin: 0 0 32px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 18px;
        line-height: 1.5;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      a {
        color: #fff;
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-underline-offset: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">404</div>
      <h1>This page doesn't exist.</h1>
      <p>It may have moved, or the link may be wrong.</p>
      <nav aria-label="Pages">
        <a href="/">SquaredMc home</a>
        <a href="/refuelr/">Refuelr</a>
      </nav>
    </main>
  </body>
</html>
